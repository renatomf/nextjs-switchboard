# Keeps dependencies current. Every update arrives as a PR, so CI checks it
# before anything reaches main.
version: 2
updates:
  # The workflow actions are pinned to commit SHAs. Dependabot moves the SHA
  # and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week: a hijacked release is usually caught and
    # pulled within days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Major updates that call for a decision rather than a merge. Security
    # updates still come through for these. Drop an entry once its reason no
    # longer holds.
    ignore:
      # Types have to match the Node runtime, which is 24 (the Trigger.dev
      # worker and CI). Newer types would let code call APIs production lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 typechecks and builds this project, but typescript-eslint
      # does not run on it yet: lint crashes. See docs/roadmap.md.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 fails lint: the React, import and a11y plugins that
      # eslint-config-next brings only support ESLint up to 9. Drop this once
      # eslint-config-next ships plugins that run on it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Stagehand 4 changes the API every node executor uses. That is a planned
      # migration (B.5 in docs/roadmap.md), not a dependency bump.
      - dependency-name: "@browserbasehq/stagehand"
        update-types: ["version-update:semver-major"]
    # The lockstep groups come first, and the catch-all at the end excludes
    # their packages by name: group order alone once let react slip into it.
    groups:
      # These have to move together: the Trigger.dev CLI warns when its version
      # drifts from the SDK's, Next's ESLint config tracks Next, and React and
      # React DOM must match.
      trigger-dev:
        patterns: ["trigger.dev", "@trigger.dev/*"]
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Everything else lands in one weekly PR for minor and patch bumps.
      # Majors still come one per PR: they can break things and deserve their
      # own look.
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "trigger.dev"
          - "@trigger.dev/*"
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
