name: E2E

# Waits for Vercel to say a deployment is ready, and takes the URL from the
# event rather than guessing when the build finished.
#
# Note for anyone editing this: GitHub runs deployment_status workflows from
# the default branch, so a change here does not take effect on the pull request
# that makes it — only once it is merged.
on:
  deployment_status:

jobs:
  e2e:
    name: Against the preview
    # Previews only. Production has real data, and these tests create and
    # delete workflows.
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production' &&
      github.event.deployment_status.environment != 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA rather than a tag, like the checks pipeline: a
      # tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that was actually deployed, so the tests match the app
          # they are pointed at.
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the browser the suite uses, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm run e2e
        env:
          # No dev server: the suite points at the deployment Vercel just built,
          # which already has its own database branch from the Neon integration.
          # Both are set by most providers and either can be the empty one, so
          # the fallback is what keeps a blank value from quietly sending the
          # suite at localhost.
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # clerk.signIn mints a session through Clerk's backend API, which is
          # what lets the suite sign in without a password.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_ORG_NAME: ${{ secrets.E2E_CLERK_ORG_NAME }}

      # The trace and screenshots of a failure, which is the difference between
      # "it broke in CI" and knowing which step broke it.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
